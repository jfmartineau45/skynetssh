[package]
name = "skynet-ssh"
version = "0.2.0"
description = "SkynetSSH — Native Tauri v2 SSH, SFTP, Tunnel & Multi-Pane Terminal Client"
authors = ["SkynetSSH"]
edition = "2021"

[lib]
name = "skynet_ssh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
notify = "6"

# Vault Encryption & OS Keychain (100% Pure Rust + Windows CredMan)
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
keyring = { version = "3", features = ["windows-native"] }

# Local ConPTY Terminal Engine
portable-pty = "0.8"

# Pure Async Rust SSH2, Keys & SFTP Engine
russh = { version = "0.49", features = ["flate2"] }
russh-sftp = "2.0"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "encryption", "rand_core"] }

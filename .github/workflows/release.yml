name: Release — Build & Publish Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS & MSI + SHA256SUMS
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification suite
        run: |
          pnpm test
          cd src-tauri
          cargo test --lib

      - name: Build Tauri NSIS & MSI installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect release artifacts & generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $dist = "release-artifacts"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" $dist/
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" $dist/
          $lines = Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path "$dist/SHA256SUMS.txt" -Encoding utf8
          Get-Content "$dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*-setup.exe
            release-artifacts/*.msi
            release-artifacts/SHA256SUMS.txt
